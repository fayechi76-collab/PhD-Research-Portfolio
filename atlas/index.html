<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mechanism Evidence Atlas · Yawen Chi</title><link rel="stylesheet" href="network.css"><link rel="stylesheet" href="public.css"><body>
<header><div class="eyebrow">Mechanism Evidence Atlas · 104,212 records · 31 Oct 2006 – 31 Oct 2026</div><button id="language" class="lang">中文</button><h1 data-zh="精神疾病机制 · 研究密度网络" data-en="Psychiatric mechanisms · Research density atlas"></h1><p data-zh="筛选疾病、方法与年份，网络与热图实时更新。连线 = 同时提及两个机制的论文（共现，非因果）。" data-en="Filter by disorder, study method and year. Network and heatmap update live. Edge = papers mentioning both mechanisms (co-occurrence, not causation)."></p></header>
<section class="metrics" id="metrics"></section>
<div class="notice" id="notice"></div>
<section class="filters"><label><span data-zh="检索机制" data-en="Search mechanism"></span><input id="search" type="search" placeholder="cortisol, microglia, sleep…"></label><label><span data-zh="疾病" data-en="Disorder"></span><select id="disease"></select></label><label><span data-zh="研究方法主类" data-en="Study method group"></span><select id="method"></select></label><label><span data-zh="起始年份" data-en="From year"></span><input id="from" type="number" min="2006" max="2026" placeholder="2006"></label><label><span data-zh="结束年份" data-en="To year"></span><input id="to" type="number" min="2006" max="2026" placeholder="2026"></label><label><span data-zh="论文类别" data-en="Paper type"></span><select id="paperType"><option value="all" data-zh="全部（含综述）" data-en="All, including reviews"></option><option value="original" selected data-zh="原始研究与二次分析" data-en="Original & secondary analyses"></option><option value="review" data-zh="仅综述与证据综合" data-en="Reviews & evidence synthesis"></option></select></label><label class="check"><input id="alerts" type="checkbox" checked><span data-zh="排除出版警示" data-en="Exclude publication alerts"></span></label><button id="reset" data-zh="重置" data-en="Reset"></button>
<select id="level" hidden><option value="all"></option></select></section>
<nav><button data-tab="network" class="active" data-zh="01 机制网络" data-en="01 Mechanism network"></button><button data-tab="coverage" data-zh="02 机制领域 × 方法热图" data-en="02 Mechanism domain × method heatmap"></button></nav>
<main><section id="network" class="view active"><div class="toolbar"><label><span data-zh="节点层级" data-en="Node level"></span> <select id="granularity" aria-describedby="node-level-note"><option value="top" selected data-zh="19 个机制领域（总览）" data-en="19 mechanism domains (overview)"></option><option value="fine" data-zh="29 个细分机制实体" data-en="29 fine-grained mechanism entities"></option></select></label><select id="edgeMode" hidden><option value="candidate" selected></option></select><label><span data-zh="聚焦实体" data-en="Focus on"></span> <select id="focus"></select></label><label><span data-zh="连线权重" data-en="Link weight"></span><select id="edgeWeight"><option value="raw" data-zh="题录数" data-en="Records"></option><option value="lift">Lift</option></select></label><label class="check"><input id="hideSymptoms" type="checkbox"><span data-zh="隐藏临床症状节点" data-en="Hide clinical-symptom node"></span></label><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="fit" data-zh="复位" data-en="Reset view"></button></div>
<p class="caption" id="node-level-note" data-zh="默认显示 19 个机制领域，与矩阵使用同一分类层级。切换后可查看归入这些领域的 29 个细分实体。" data-en="The overview uses the same 19 mechanism domains as the matrix. Switch to the 29 fine-grained entities to explore specific topics within those domains."></p>
<p class="caption" id="networkCaption"></p><div class="workspace"><div class="graphWrap"><svg id="graph" viewBox="0 0 1000 720" aria-label="Mechanism research density network" role="img"></svg></div><aside id="inspector"></aside></div></section>
<section id="bars" class="view" hidden><div id="barList"></div><aside id="barInspector"></aside><p id="barCaption"></p></section>
<section id="chains" class="view" hidden><select id="chainSelect"></select><p id="chainWarning"></p><div id="chainList"></div></section>
<section id="coverage" class="view"><p class="caption" data-zh="热图行使用 19 个机制领域，列使用 7 类研究方法。" data-en="Rows use 19 mechanism domains and columns use seven study-method groups."></p><div id="coverageText"></div><h3 data-zh="年度分布（当前筛选）" data-en="Records per year (current filters)"></h3><div id="yearChart"></div></section></main>
<footer data-zh="共现不等于因果 · 题录数不等于独立研究数 · © Yawen Chi" data-en="Co-occurrence is not causation · record counts are not independent studies · © Yawen Chi"></footer>
<script src="data.js"></script><script src="network.js"></script></body></html>
