<header><div class="eyebrow"><span>LITERATURE CATALOG EXPLORER · 104,212 RECORDS · 120 JOURNAL TITLES · 31 OCT 2006 – 31 OCT 2026</span><button id="language">English</button></div><h1>Literature catalog explorer</h1><p class="lead" id="intro"></p><div class="stats" id="stats"></div><p hidden><a id="scope-link"></a><a id="pilot-link"></a><a id="map-link"></a></p><nav class="tabs"><button data-tab="papers" id="tab-papers" hidden></button><button data-tab="matrix" id="tab-matrix"></button><button data-tab="coverage" id="tab-coverage"></button><button data-tab="journals" id="tab-journals">期刊来源</button></nav></header>
<main><div class="loading" id="loading" role="status"></div><div class="note" id="safety-note"></div>
<p class="tabintro" id="tab-intro"></p><div class="note" id="journal-family-note" hidden><span id="journal-family-label"></span> <button id="journal-family-clear">取消来源系列筛选</button></div><section id="filters"><div class="toolbar" aria-disabled="true"><label><span id="label-search"></span><input id="search" type="search"></label><label><span id="label-disease"></span><select id="disease"></select></label><label><span id="label-mechanism"></span><select id="mechanism"></select></label><label><span id="label-method"></span><select id="method"></select></label></div>
<div class="toolbar second" aria-disabled="true"><label><span id="label-year"></span><select id="year"></select></label><label><span id="label-drug"></span><select id="drug"></select></label><label><span id="label-status"></span><select id="status"></select></label><label><span id="label-sort"></span><select id="sort"></select></label></div><div class="toolbar" style="grid-template-columns:1fr 1fr;margin-top:12px" aria-disabled="true"><label><span id="label-design">Specific design</span><select id="design"></select></label><label><span id="label-journal">Journal</span><select id="journal"></select></label></div></section>
<section id="papers"><div class="resultline"><span id="result-count" aria-live="polite"></span><span id="page-note"></span><button id="reset">清除筛选 / Reset</button></div><div id="paper-list"></div><div class="pager"><button id="prev"></button><span id="page-count"></span><button id="next"></button></div></section>
<section id="matrix" hidden><h2 id="matrix-title"></h2><select id="matrix-mode" style="max-width:650px"></select><div class="note" id="matrix-note"></div><div class="matrixwrap" id="matrix-table"></div><p class="legend" id="matrix-legend"></p></section>
<section id="coverage" hidden><h2 id="coverage-title"></h2><div class="note warn" id="coverage-note"></div><div class="split"><section><h3 id="disease-dist-title"></h3><ul id="disease-dist" class="dist"></ul></section><section><h3 id="method-dist-title"></h3><ul id="method-dist" class="dist"></ul></section></div></section>
<section id="journals" hidden><h2 id="journal-source-title">期刊来源 Journal Source</h2><div class="note" id="journal-source-note"></div><div class="stats" id="journal-source-summary"></div><h3 id="journal-source-focus-title"></h3><div class="wide" id="journal-source-focus"></div><h3 id="journal-source-top-title"></h3><ul class="dist" id="journal-source-top"></ul><h3 id="journal-source-table-title"></h3><div class="wide" id="journal-source-table"></div><div class="note warn" id="journal-source-audit"></div></section></main><footer id="footer"></footer><script>
window.ELTabFilters=function(){var SETS={matrix:['disease','year','journal'],coverage:['disease','mechanism','method','design','year'],journals:['disease','mechanism','year','journal']};

var t=EL.tab,set=SETS[t]||[],changed=false;
['search','disease','mechanism','method','year','drug','status','sort','design','journal'].forEach(function(id){var el=document.getElementById(id);if(!el)return;var lab=el.closest('label');var on=set.indexOf(id)>=0;if(lab)lab.classList.toggle('offtab',!on);if(!on&&el.value!==''&&EL._lastTab!==undefined&&EL._lastTab!==t){el.value='';changed=true;}});

var intro=document.getElementById('tab-intro');if(intro)intro.textContent=EL.lang==='zh'?'':(INTRO[t]||'');
var prev=EL._lastTab;EL._lastTab=t;if(changed&&prev!==t){EL.crossKeep=true;setTimeout(function(){update();},0);}};
</script><script src="assets/portal.js"></script><script src="assets/journal-source-data.js"></script><script src="assets/journal-source.js"></script><script src="assets/config.js"></script><script>(function(){var t=0,iv=setInterval(function(){var b=document.querySelector('[data-tab="matrix"]');t++;if(b&&window.EL&&EL.s&&EL.loaded===EL.s.catalog_records){b.click();clearInterval(iv);}if(t>200)clearInterval(iv);},100);})();</script><script>(function(){if(window.parent===window)return;var last=0;function s(){var b=document.body;if(!b)return;var cs=getComputedStyle(b);var h=Math.ceil(b.getBoundingClientRect().height+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom));if(Math.abs(h-last)>2){last=h;window.parent.postMessage({toolHeight:h},"*");}}window.addEventListener("load",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.body);setInterval(s,1000);s();})();</script></body></html>
